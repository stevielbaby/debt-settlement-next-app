services:
  app:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    env_file:
      - .env.local
    command: sh -c "npm install && npm run postinstall && npm run dev"
    restart: unless-stopped
    networks:
      - app-network

  stripe-cli:
    image: stripe/stripe-cli:latest
    command: listen --forward-to app:3000/api/stripe/webhook --skip-verify
    environment:
      - STRIPE_API_KEY=${STRIPE_SECRET_KEY}
    env_file:
      - .env.local
    depends_on:
      - app
    networks:
      - app-network
    profiles:
      - stripe # Only start when explicitly requested

networks:
  app-network:
    driver: bridge

